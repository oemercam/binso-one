<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binso One – Klickbare UX A–Z</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;--blue:#2566bd;--fg:#263950;--mut:#647080;--line:#edf1f6;--bg:#fff;--pale:#edf4ff;--surface:#fff;background:var(--bg);color:var(--fg)}*{box-sizing:border-box}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100dvh}.nav{border-right:1px solid var(--line);padding:17px 10px;background:#fff}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:1.2px;padding:5px 12px 19px}.symbol{display:grid;place-items:center;width:31px;height:31px;border-radius:8px;background:var(--blue);color:white}.nav h3{font-size:11px;color:var(--mut);font-weight:600;margin:13px 12px 7px}.nav button{display:block;border:0;border-radius:8px;background:transparent;text-align:left;padding:10px 12px;width:100%;color:var(--fg);font-size:13px}.nav button.active{background:var(--pale);color:var(--blue);font-weight:700}.nav button:hover:not(.active){background:#f6f9fc}.shell{min-width:0}.header{height:62px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.header-title{font-weight:750}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;color:var(--mut)}.body{padding:23px 25px 120px;max-width:1140px;margin:auto}.page-head{display:flex;align-items:start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.page-head h1{font-size:25px;letter-spacing:-.6px;margin:0 0 3px}.muted{color:var(--mut);font-size:12px}.actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn,.pill{border:1px solid #dce6f2;border-radius:8px;height:36px;padding:0 13px;background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}.btn.primary,.pill.active{background:var(--blue);color:white;border-color:var(--blue)}.pill{border-radius:999px;height:33px}.btn.icon{width:36px;padding:0}.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}.panel.pad{padding:16px}.panel h2{margin:0 0 9px;font-size:14px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{padding:15px}.tile strong{font-size:23px;display:block;letter-spacing:-.5px}.tile .muted{display:block;margin-top:4px}.row{min-height:58px;border-bottom:1px solid var(--line);padding:11px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:transparent;color:var(--fg);text-align:left;border-left:0;border-right:0;border-top:0}.row:last-child{border-bottom:0}.row:hover{background:#fafcff}.row strong{font-size:13px}.row .small{display:block;color:var(--mut);font-size:11px;margin-top:3px}.status{border:1px solid #e1e8f0;border-radius:999px;padding:4px 9px;font-size:11px;white-space:nowrap;color:#596a7a}.expanded{background:#fafdff;padding:14px 15px;border-bottom:1px solid var(--line)}.expanded p{font-size:12px;color:var(--mut)}.section{margin-top:18px}.empty{font-size:12px;color:var(--mut);padding:12px 15px}.field{display:block;margin-bottom:13px}.field span{font-size:12px;font-weight:600;display:block;margin-bottom:6px}.input{border:1px solid #dbe5ef;border-radius:8px;min-height:39px;padding:9px 11px;width:100%;background:white;color:var(--fg);font-size:14px}.input:focus{border-color:var(--blue)}textarea.input{min-height:95px;resize:vertical}.input-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.notice{border:1px solid #dde8f5;border-radius:10px;background:#f5f9ff;color:#576e89;padding:11px 13px;font-size:12px;line-height:1.6;margin:12px 0}.timer{font-size:45px;font-weight:750;letter-spacing:1px;text-align:center;padding:24px 0 10px}.timer-actions{display:flex;justify-content:center;gap:8px;padding:0 0 20px}.timer-actions .btn{min-width:90px}.chat{height:260px;overflow:auto;padding:12px;background:#f8fbff}.bubble{background:#e9f2ff;border-radius:13px 13px 13px 3px;padding:10px 13px;max-width:84%;font-size:13px;margin:12px 0}.bubble.right{background:#eef0f3;margin-left:auto;border-radius:13px 13px 3px 13px}.chat-input{display:flex;gap:7px;border-top:1px solid var(--line);padding:10px}.auth{max-width:355px;margin:28px auto;text-align:center}.auth h2{font-size:24px;margin:7px 0 15px}.auth-panel{text-align:left;border:1px solid var(--line);border-radius:13px;padding:20px}.sheet-overlay{position:fixed;inset:0;z-index:30;background:#0007;display:flex;align-items:flex-end;justify-content:center;padding:12px}.sheet{width:100%;max-width:460px;max-height:85dvh;overflow-y:auto;background:white;border-radius:18px;padding:17px}.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.sheethead strong{font-size:15px}.round{border:1px solid var(--line);border-radius:50%;background:white;height:36px;width:36px;font-size:19px}.step{display:inline-flex;align-items:center;justify-content:center;background:#eef4ff;color:#48688c;border-radius:999px;width:23px;height:23px;font-size:11px;font-weight:650}.divider{border-top:1px solid var(--line);margin:15px 0}.dock{display:none}.fab{position:fixed;right:21px;bottom:23px;border:0;border-radius:50%;background:var(--blue);color:white;box-shadow:0 5px 17px #2566bd4d;width:55px;height:55px;font-size:29px;z-index:12}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 16px;border-radius:999px;font-size:12px;z-index:40;white-space:nowrap}.hidden{display:none!important}
@media(pointer:coarse){.btn,.pill,.round{min-height:44px}.input{min-height:44px;font-size:16px}}
@media(max-width:780px){.layout{display:block}.nav{display:none}.header{padding:0 16px;height:56px}.body{padding:18px 15px 125px}.page-head h1{font-size:23px}.tiles{grid-template-columns:1fr 1fr}.input-row{grid-template-columns:1fr}.dock{display:flex;position:fixed;bottom:calc(env(safe-area-inset-bottom) + 5px);left:50%;transform:translateX(-50%);z-index:10;background:#fff;border:1px solid var(--line);padding:6px 8px;gap:4px;border-radius:18px;box-shadow:0 6px 18px #1d426626}.dock button{height:46px;width:48px;border:0;background:transparent;border-radius:11px;color:#66788c;font-size:18px}.dock button.active{background:#edf4ff;color:var(--blue)}.fab{bottom:calc(env(safe-area-inset-bottom) + 81px);right:17px}.sheet-overlay{padding:0}.sheet{max-width:none;border-radius:18px 18px 0 0;max-height:86dvh;padding:18px 18px max(18px,env(safe-area-inset-bottom))}.timer{font-size:41px}}
</style></head><body>
<div class="layout"><aside class="nav" id="sidebar"></aside><div class="shell"><header class="header"><span class="header-title">BINSO <span style="font-weight:400;color:#647080">ONE</span></span><span class="chip">Interaktive Referenz · keine Echtdaten</span></header><main class="body" id="content"></main></div></div><nav class="dock" id="dock" aria-label="Mobile Demo-Navigation"></nav><button class="fab" id="fab" aria-label="Neu erstellen">+</button><div id="modal"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
const NAV=[
['dashboard','Übersicht','Start'],['kunden','Kunden','Verkauf'],['angebote','Angebote','Verkauf'],['rechnungen','Rechnungen','Verkauf'],['produkte','Produkte','Verkauf'],['projekte','Aufträge & Projekte','Organisation'],['zeit','Zeiterfassung','Organisation'],['mitarbeiter','Mitarbeiter','Organisation'],['abwesenheiten','Abwesenheiten','Organisation'],['zahlungen','Zahlungen','Finanzen'],['spesen','Spesen','Finanzen'],['lieferanten','Lieferanten','Finanzen'],['vertraege','Verträge','Finanzen'],['finanzen','Finanzen','Finanzen'],['berichte','Berichte','Finanzen'],['support','Support','Service'],['notifications','Benachrichtigungen','Service'],['settings','Einstellungen','System'],['login','Kundenlogin','Zugang'],['register','Registrierung','Zugang'],['invite','Einladung','Zugang'],['otp','E-Mail-Code','Zugang'],['operator','Operator-Login','Zugang'],['error','Fehlerzustände','System'],['loading','Lade-/Offline-Zustände','System']];
const demo={kunden:[['Musterfirma AG','Aktiv','Bern'],['Beispiel GmbH','Aktiv','Zürich'],['Privatkunde Muster','Neu','Basel']],angebote:[['ANG-2026-014','Offen','CHF 2’400.00'],['ANG-2026-013','Angenommen','CHF 1’900.00']],rechnungen:[['RE-2026-024','Offen','CHF 1’280.00'],['RE-2026-023','Bezahlt','CHF 840.00']],produkte:[['IT-Beratung','Aktiv','CHF 150.00 / h'],['Support-Paket','Aktiv','CHF 480.00']],projekte:[['Website-Relaunch','In Arbeit','Musterfirma AG'],['Cloud-Migration','Geplant','Beispiel GmbH']],mitarbeiter:[['Muster Mitarbeiter','Aktiv','20 h'],['Beispiel Mitarbeiter','Aktiv','32 h']],abwesenheiten:[['Ferienantrag','Offen','24.–27.11.2026']],zahlungen:[['Zahlung RE-2026-023','Verbucht','CHF 840.00']],spesen:[['Fahrtkosten','Eingereicht','CHF 28.00']],lieferanten:[['Beispiel Lieferant AG','Aktiv','Schweiz']],vertraege:[['IT-Servicevertrag','Aktiv','2026–2027']],support:[['T-1042 · Rückfrage zur Rechnung','Offen','Heute'],['T-1041 · Anmeldung','In Bearbeitung','Gestern']],notifications:[['Rechnung bezahlt','Ungelesen','Heute'],['Neues Ticket','Gelesen','Gestern']]};
let s={page:'dashboard',filter:'Alle',expanded:null,modal:null,dirty:false,ticking:false,elapsed:0,chat:['Guten Tag, wir prüfen dein Anliegen.'],step:1};
const $=q=>document.querySelector(q),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.ti);window.ti=setTimeout(()=>$('#toast').classList.add('hidden'),2400)}
function navig(){let old='';$('#sidebar').innerHTML='<div class="brand"><span class="symbol">B</span>BINSO ONE</div>'+NAV.map(([id,name,group])=>{let h=group!==old?'<h3>'+group+'</h3>':'';old=group;return h+'<button class="'+(s.page===id?'active':'')+'" data-go="'+id+'">'+name+'</button>'}).join('');const p=[['dashboard','⌂'],['kunden','♙'],['rechnungen','▤'],['zeit','◷'],['settings','⚙']];$('#dock').innerHTML=p.map(([id,ic])=>'<button class="'+(s.page===id?'active':'')+'" data-go="'+id+'" aria-label="'+id+'">'+ic+'</button>').join('');$('#fab').classList.toggle('hidden',['login','register','otp','invite','operator'].includes(s.page)||!!s.modal)}
function heading(name,desc,act){return '<div class="page-head"><div><h1>'+name+'</h1><div class="muted">'+desc+'</div></div>'+(act?'<div class="actions"><button class="btn primary" data-action="create">＋ Neu</button></div>':'')+'</div>'}
function filters(){return '<div class="filters" style="margin-bottom:13px">'+['Alle','Offen','Aktiv','Erledigt'].map(x=>'<button data-filter="'+x+'" class="pill '+(s.filter===x?'active':'')+'">'+x+'</button>').join('')+'<button class="btn" data-action="search">⌕ Suchen</button></div>'}
function list(id){let data=demo[id]||[];const rows=data.filter(x=>s.filter==='Alle'||x[1]===s.filter||s.filter==='Erledigt'&&['Bezahlt','Verbucht','Angenommen'].includes(x[1]));return '<section class="panel">'+(rows.length?rows.map((v,i)=>'<div><button class="row" data-expand="'+id+i+'"><span><strong>'+esc(v[0])+'</strong><span class="small">'+esc(v[2])+'</span></span><span class="status">'+esc(v[1])+'</span></button>'+(s.expanded===id+i?'<div class="expanded"><strong>'+esc(v[0])+'</strong><p>Details und fachliche Aktionen werden in der echten Anwendung nach Berechtigungen angezeigt.</p><div class="actions"><button class="btn" data-action="edit">Bearbeiten</button><button class="btn" data-action="details">Details</button></div></div>':'')+'</div>').join(''):'<div class="empty">Keine passenden Einträge.</div>')+'</section>'}
function dashboard(){return heading('Übersicht','Dein Unternehmen auf einen Blick')+'<div class="tiles">'+[['Offene Rechnungen','2'],['Angebote','1'],['Zeiten heute','02:15']].map(([a,b])=>'<div class="panel tile"><div class="muted">'+a+'</div><strong>'+b+'</strong></div>').join('')+'</div><section class="panel pad section"><h2>Was steht an?</h2><button class="row" data-go="rechnungen"><span>Offene Rechnungen prüfen</span><span>›</span></button><button class="row" data-go="zeit"><span>Zeiterfassung öffnen</span><span>›</span></button><button class="row" data-go="support"><span>Supportanfragen ansehen</span><span>›</span></button></section>'}
function generic(){const cur=NAV.find(v=>v[0]===s.page);return heading(cur?.[1]||'Ansicht','Kompakte Liste, direkte Details und berechtigte Aktionen',true)+filters()+list(s.page)}
function zeit(){let h=Math.floor(s.elapsed/3600),m=Math.floor(s.elapsed%3600/60),sec=s.elapsed%60;return heading('Zeiterfassung','Timer vor der Projektzuordnung, laufende Zeit bleibt erhalten')+'<div class="panel pad"><div class="muted" style="text-align:center">'+(s.ticking?'Timer läuft':'Timer pausiert')+'</div><div class="timer">'+[h,m,sec].map(v=>String(v).padStart(2,'0')).join(':')+'</div><div class="timer-actions"><button class="btn primary" data-action="start">'+(s.ticking?'Pause':'Start')+'</button><button class="btn" data-action="stop">Stop</button></div><div class="input-row"><label class="field"><span>Kunde</span><select class="input"><option>Musterfirma AG</option><option>Beispiel GmbH</option></select></label><label class="field"><span>Auftrag / Projekt</span><select class="input"><option>Website-Relaunch</option><option>Cloud-Migration</option></select></label></div></div><section class="panel pad section"><h2>Heute</h2><div class="row"><span>IT-Beratung · 09:00–10:30</span><span class="status">01:30</span></div><button class="btn" data-action="manual">＋ Zeit manuell erfassen</button></section>'}
function support(){return heading('Support','Kurze Ticketnummern und kompakte Nachrichtenübersicht','x')+list('support')+'<div class="panel section"><div class="chat" id="chat"><div class="bubble">Hallo! Wie können wir helfen?</div>'+s.chat.map(t=>'<div class="bubble right">'+esc(t)+'</div>').join('')+'</div><div class="chat-input"><input class="input" id="message" placeholder="Nachricht schreiben …" aria-label="Nachricht"><button class="btn primary" data-action="chat">Senden</button></div></div>'}
function settings(){return heading('Einstellungen','Persönliche und geschäftliche Einstellungen klar getrennt')+'<div class="tiles">'+[['Firma','Firmendaten und Dokumente'],['Konto','Profil, Sicherheit, Sitzungen'],['Team','Einladungen und Rollen'],['Darstellung','Sprache, Light- und Dark-Mode'],['Zeiterfassung','Stundensätze und Defaults'],['Abonnement','Plan und Berechtigungen']].map(x=>'<button class="panel pad" style="text-align:left" data-action="edit"><strong>'+x[0]+'</strong><div class="muted">'+x[1]+'</div></button>').join('')+'</div>'}
function financial(){return heading(s.page==='finanzen'?'Finanzen':'Berichte','Kennzahlen mit Zeitraum und Berechtigungsprüfung')+'<div class="filters"><button class="pill active">Monat</button><button class="pill">Quartal</button><button class="pill">Jahr</button></div><div class="tiles section">'+[['Forderungen','CHF 2’120'],['Angebotsvolumen','CHF 4’300'],['Zeiten','12.5 h']].map(v=>'<div class="panel tile"><span class="muted">'+v[0]+'</span><strong>'+v[1]+'</strong></div>').join('')+'</div><div class="notice">Synthetische Werte. Keine Berechnung und kein Finanzexport.</div>'}
function auth(){let title={login:'Anmelden',register:'Registrieren',invite:'Einladung annehmen',otp:'E-Mail bestätigen',operator:'Operator-Anmeldung'}[s.page];return '<div class="auth"><span class="symbol" style="margin:auto">B</span><h2>'+title+'</h2><div class="auth-panel"><p class="muted">Diese Vorschau simuliert nur die Oberfläche; echte Kunden- und Operator-Authentifizierung bleiben getrennt.</p><label class="field"><span>E-Mail-Adresse</span><input class="input" type="email" autocomplete="username" placeholder="name@firma.ch"></label>'+(!['otp','invite'].includes(s.page)?'<label class="field"><span>Passwort</span><input class="input" type="password" autocomplete="current-password"></label>':'<label class="field"><span>'+ (s.page==='otp'?'Bestätigungscode':'Einladungscode')+'</span><input class="input" inputmode="numeric" autocomplete="one-time-code" placeholder="Code"></label>')+'<button class="btn primary" style="width:100%" data-action="auth">Weiter</button><button class="btn" style="width:100%;margin-top:8px" data-go="login">Zur Anmeldung</button></div></div>'}
function error(){return heading('Fehler- und Systemzustände','Zustände sind simuliert, keine echte Störung')+'<div class="tiles">'+[['401','Anmeldung erforderlich'],['403','Keine Berechtigung'],['404','Seite nicht gefunden'],['500','Unerwarteter Fehler'],['Offline','Verbindung unterbrochen'],['Leer','Keine Einträge']].map(([x,y])=>'<button class="panel pad" data-action="error"><strong>'+x+'</strong><div class="muted">'+y+'</div></button>').join('')+'</div>'}
function loading(){return heading('Laden, Offline und Feedback','Klare Hinweise und sichere Wiederherstellung')+'<section class="panel pad"><h2>Wird geladen …</h2><div style="height:12px;width:65%;background:#eef3fa;border-radius:9px;margin:12px 0"></div><div style="height:12px;width:95%;background:#eef3fa;border-radius:9px;margin:12px 0"></div><div class="divider"></div><div class="notice">Offline. Angezeigte Daten können veraltet sein.</div><button class="btn" data-action="retry">Erneut versuchen</button></section>'}
function render(){navig();let page=s.page;$('#content').innerHTML=(page==='dashboard'?dashboard():page==='zeit'?zeit():page==='support'?support():page==='settings'?settings():['finanzen','berichte'].includes(page)?financial():['login','register','invite','otp','operator'].includes(page)?auth():page==='error'?error():page==='loading'?loading():generic())+'<p class="muted" style="margin-top:22px">Klickbare, abgeleitete A–Z-Referenz – niemals als realen Kunden-/Finanz- oder Authentifizierungsnachweis verwenden.</p>';$('#fab').classList.toggle('hidden',['login','register','invite','otp','operator'].includes(page));}
function modal(title,form){s.modal=title;s.dirty=false;$('#modal').innerHTML='<div class="sheet-overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header class="sheethead"><button class="round" data-action="cancel" aria-label="Schliessen">×</button><strong>'+esc(title)+'</strong><button class="round" data-action="save" aria-label="Speichern">✓</button></header>'+form+'</section></div>';$('#fab').classList.add('hidden')}
function field(label,value){return '<label class="field"><span>'+label+'</span><input class="input" value="'+esc(value)+'"></label>'}
function quick(){modal('Neu erstellen','<p class="muted">Berechtigungsabhängige Schnellaktionen – nur simuliert.</p><div class="tiles" style="grid-template-columns:1fr 1fr">'+[['Kunde','kunden'],['Angebot','angebote'],['Rechnung','rechnungen'],['Projekt','projekte'],['Zeiteintrag','zeit'],['Ausgabe','spesen']].map(([n,id])=>'<button class="btn" data-create="'+id+'">＋ '+n+'</button>').join('')+'</div>')}
function close(){if(s.dirty&&!confirm('Ungespeicherte Änderungen verwerfen?'))return;s.dirty=false;s.modal=null;$('#modal').innerHTML='';render()}
document.addEventListener('click',e=>{let x=e.target.closest('button');if(!x)return;if(x.dataset.go){s.page=x.dataset.go;s.filter='Alle';s.expanded=null;render();return}if(x.dataset.filter){s.filter=x.dataset.filter;render();return}if(x.dataset.expand){s.expanded=s.expanded===x.dataset.expand?null:x.dataset.expand;render();return}if(x.dataset.create){s.page=x.dataset.create;s.modal=null;$('#modal').innerHTML='';render();modal('Neu erfassen',field('Bezeichnung','')+field('Beschreibung',''));return}if(x.id==='fab'){quick();return}if(x.dataset.action){const a=x.dataset.action;if(a==='start'){s.ticking=!s.ticking;render();return}if(a==='stop'){s.ticking=false;toast('Timer-Demo gestoppt');render();return}if(a==='chat'){const i=$('#message');if(i.value.trim())s.chat.push(i.value.trim());render();return}if(a==='cancel'){close();return}if(a==='save'){s.modal=null;s.dirty=false;$('#modal').innerHTML='';toast('Lokal simuliert – nichts gespeichert');render();return}if(a==='create'){quick();return}if(a==='error'){toast('Nur Fehlerzustands-Demo');return}if(a==='retry'||a==='auth'){toast('Nur Simulation – keine API aufgerufen');return}modal(({edit:'Bearbeiten',details:'Details',search:'Suche',manual:'Zeit manuell erfassen'})[a]||'Bearbeiten',field('Bezeichnung','Beispiel')+'<div class="notice">Keine echte Speicherung oder Mutation.</div>')}});document.addEventListener('input',e=>{if(e.target.closest('.sheet'))s.dirty=true});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal)close()});setInterval(()=>{if(s.ticking){s.elapsed++;if(s.page==='zeit'){const d=new Date(s.elapsed*1000).toISOString().slice(11,19);const el=document.querySelector('.timer');if(el)el.textContent=d}}},1000);render();
})();
</script></body></html>
