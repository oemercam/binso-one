function collection(){return T(name(state.page))+'<p class="description">Einträge übersichtlich verwalten und bearbeiten.</p><div class="actions"><button class="btn primary" data-action="create">'+I('plus')+' Neu</button><button class="btn" data-action="filter">'+I('filter')+' Filter</button></div>'+controls()+rows()}
function dashboard(){return T('Übersicht')+'<div class="metrics">'+[['Offene Rechnungen','2'],['Angebote','1'],['Zeit heute','02:15'],['Offene Tickets','1']].map(x=>'<div class="metric"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><p class="sectionlabel">Schnellzugriff</p>'+G(R('Kunden','customers','','users','#8e8e93')+R('Rechnungen','invoices','','receipt','#439d6b')+R('Zeiterfassung','time','','clock','#b18a53')+R('Support','support','','help','#8f7aad'))}
function settings(){return T('Einstellungen')+G(R('Mein Konto','account','Profil und Sicherheit','user','#8e8e93'))+G(R('Allgemein','general','','settings','#8e8e93')+R('Unternehmen','company','','building','#737b85')+R('Team','team','','users','#977ab9'))+G(R('Darstellung','appearance',document.body.classList.contains('dark')?'Dunkel':'Hell','palette','#83838c')+R('Sprache','language','Deutsch','settings','#888890')+R('Benachrichtigungen','notifications','','bell','#de6258'))+G(R('Rechnungen','invoicePrefs','','receipt','#aa8b5a')+R('Zeiterfassung','timePrefs','','clock','#4d9f70')+R('Abonnement','billing','','wallet','#9e8757'))}
function general(){return hero('settings','Allgemein','App-Informationen, Sprache und grundlegende Einstellungen.')+G(R('Informationen','about','','file-text')+R('Darstellung','appearance','','palette')+R('Sprache','language','Deutsch','settings'))}
function account(){return G(R('Persönliche Angaben','edit')+R('Sicherheit','security')+R('Sitzungen','sessions'))+G(R('Unternehmen','company')+R('Team','team'))}
function about(){return G(R('App-Name','record','Binso One')+R('Version','record','Designreferenz')+R('Plattform','record','Web / PWA')+R('Herausgeber','company','Binso GmbH'))}
function security(){return hero('shield','Sicherheit','Passwort, Sicherheitsbestätigungen und Sitzungen.')+G(R('Passwort ändern','edit')+R('Sitzungen','sessions')+R('Wiederherstellung','reset'))}
function sessions(){return G(R('Dieses Gerät','record','Aktiv')+R('Andere Sitzungen','record','2'))+'<button class="save" data-action="simulate">Andere Sitzungen beenden</button>'}
function company(){return T('Unternehmen')+G(F('Firma','Binso GmbH')+F('Ort','Appenzell')+F('Telefon','058 510 88 58'))+'<button class="save" data-action="simulate">Speichern</button>'}
function team(){return G(R('Mitglieder','record','2')+R('Einladungen','invite','1'))+'<button class="save" data-go="invite">Person einladen</button>'}
function appearance(){return G(R('Farbschema','record',document.body.classList.contains('dark')?'Dunkel':'Hell')+R('Schriftgrösse','record','Standard'))+'<p class="note">Die Theme-Schaltfläche oben wechselt Light und Dark.</p>'}
function language(){return G(['Deutsch','Französisch','Italienisch','Englisch','Türkisch'].map((x,i)=>R(x,'record',i===0?'Ausgewählt':'')).join(''))}
function pref(){return G(R('Standardwerte','edit')+R('Vorlagen','edit')+R('Weitere Einstellungen','edit'))}
function notifications(){return G(['push','email'].map((k,i)=>'<div class="row"><span class="rowtext">'+(i===0?'Push-Benachrichtigungen':'E-Mail-Mitteilungen')+'</span><button class="toggle '+(state.switches[k]?'on':'')+'" data-switch="'+k+'" role="switch" aria-checked="'+state.switches[k]+'"></button></div>').join(''))}
function finance(){return T(name(state.page))+'<div class="metrics"><div class="metric"><small>Forderungen</small><strong>CHF 2’120</strong></div><div class="metric"><small>Angebote</small><strong>CHF 4’300</strong></div></div>'+G(R('Zeitraum','record','November 2026')+R('Auswertung','record')+R('Export','record'))+'<p class="note">Synthetische Werte; keine echten Finanzberechnungen.</p>'}
function time(){let v=[Math.floor(state.timer/3600),Math.floor(state.timer%3600/60),state.timer%60].map(x=>String(x).padStart(2,'0')).join(':');return T('Zeiterfassung')+G('<div style="padding:17px"><div class="timer" id="timer">'+v+'</div><div class="actions" style="justify-content:center"><button class="btn primary" data-action="timer">'+I('clock')+(state.ticking?' Pause':' Start')+'</button><button class="btn" data-action="stop">Stop</button></div></div>')+G('<label class="field"><span>Kunde</span><select><option>Musterfirma AG</option><option>Beispiel GmbH</option></select></label><label class="field"><span>Projekt</span><select><option>Website-Relaunch</option><option>Cloud-Migration</option></select></label>')+'<p class="sectionlabel">Heute</p>'+G(R('IT-Beratung','record','01:30'))+'<button class="save" data-action="edit">Zeit manuell erfassen</button>'}
function wizard(){let n=state.step;return T('Rechnung erstellen')+'<p class="description">Schritt '+n+' von 4</p><div class="steps">'+[1,2,3,4].map(i=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</div>'+(n===1?G('<label class="field"><span>Kunde</span><select><option>Musterfirma AG</option><option>Beispiel GmbH</option></select></label>'):n===2?G(F('Leistung',state.invoice.service)+F('Menge',state.invoice.qty)+F('Preis CHF',state.invoice.price)):n===3?G(R('Zahlungsfrist','record','30 Tage')+R('Rechnungsdatum','record','Heute')):G(R('Kunde','record','Musterfirma AG')+R('Leistung','record',state.invoice.service)+R('Zwischensumme','record','CHF 300.00')))+'<div class="actions"><button class="btn" data-action="prev" '+(n===1?'disabled':'')+'>Zurück</button><button class="btn primary" data-action="next">'+(n===4?'Entwurf simulieren':'Weiter')+'</button></div>'}
function record(){let a=DATA[state.originalModule]?.[state.record]||['Beispieldatensatz','Aktiv',''];return hero('file-text',esc(a[0]),'Details und Informationen zum Datensatz.')+G(R('Status','edit',a[1])+R('Informationen','edit',a[2])+R('Dateien','files')+R('Aktivitäten','edit'))+'<button class="save" data-go="edit">Bearbeiten</button>'}
function edit(){return T('Bearbeiten')+G(F('Bezeichnung','Beispieldatensatz')+F('Notiz',''))+'<button class="save" data-action="simulate">Änderungen speichern</button>'}
function files(){return G(R('Dokument hochladen','edit')+R('Anhänge','record','Keine Dateien'))}
function supportChat(){return '<div class="chat"><div class="messages"><div class="bubble">Guten Tag, wie können wir helfen?</div>'+state.chat.map(v=>'<div class="bubble me">'+esc(v)+'</div>').join('')+'</div><div class="composer"><input id="message" placeholder="Nachricht schreiben …" aria-label="Nachricht"><button data-action="send">Senden</button></div></div>'}
function access(){let p=state.page,t=name(p);return '<div class="auth">'+T(t)+'<p class="description">Sichere Binso-One-Anmeldung – nur Designsimulation.</p>'+(p==='otp'?G(F('Sechsstelliger Code','','text')):p==='reset'||p==='invite'?G(F('E-Mail-Adresse','','email')):p==='register'?G(F('Kontaktperson','')+F('Firma','')+F('E-Mail-Adresse','','email')+F('Passwort','','password')):G(F('E-Mail-Adresse','','email')+F('Passwort','','password')))+'<button class="save" data-action="simulate">Weiter</button><div class="actions"><button class="btn" data-go="auth">Anmelden</button><button class="btn" data-go="reset">Passwort vergessen</button><button class="btn" data-go="register">Registrieren</button></div></div>'}
function states(){let d={404:'Seite nicht gefunden',403:'Kein Zugriff',500:'Unerwarteter Fehler',Offline:'Keine Verbindung',Laden:'Wird geladen …',Leer:'Keine Einträge'};return T('Systemzustände')+'<div class="switchtabs">'+Object.keys(d).map(x=>'<button data-error="'+x+'" class="'+(state.error===x?'active':'')+'">'+x+'</button>').join('')+'</div>'+hero('help',state.error,d[state.error])+'<button class="save" data-action="simulate">Erneut versuchen</button>'}
function operator(){return T('Plattformverwaltung')+'<p class="description">Getrennte Operator-Rollen und unabhängige Anmeldung.</p>'+G(R('Organisationen','record')+R('Supportbetrieb','record')+R('Monitoring','record')+R('Audit','record')+R('Sicherheit','record'))}
function view(){let p=state.page;if(DATA[p]&&p!=='support')return collection();switch(p){case 'dashboard':return dashboard();case 'settings':return settings();case 'general':return general();case 'about':return about();case 'account':return account();case 'security':return security();case 'sessions':return sessions();case 'company':return company();case 'team':return team();case 'appearance':return appearance();case 'language':return language();case 'invoicePrefs':case 'timePrefs':case 'billing':return pref();case 'notifications':return T('Benachrichtigungen')+notifications();case 'finance':case 'reports':return finance();case 'time':return time();case 'wizard':return wizard();case 'record':return record();case 'edit':return edit();case 'files':return files();case 'support':return collection()+'<button class="save" data-go="chat">Nachrichten öffnen</button>';case 'chat':return supportChat();case 'auth':case 'register':case 'invite':case 'otp':case 'reset':return access();case 'states':return states();case 'operator':return operator();default:return T(name(p))+G(R('Informationen','record')+R('Bearbeiten','edit'))}}
function nav(){let last='';$('#nav').innerHTML=NAV.map(([p,t,icon,category])=>{let h=last!==category?'<div class="navsection">'+category+'</div>':'';last=category;return h+'<button class="navitem '+(p===state.page?'active':'')+'" data-root="'+p+'">'+I(icon)+t+'</button>'}).join('');$('#bottom').innerHTML=[['dashboard','house','Start'],['customers','users','Kunden'],['invoices','receipt','Rechnungen'],['time','clock','Zeit'],['settings','menu','Mehr']].map(([id,icon,t])=>'<button class="'+(id===state.page?'active':'')+'" data-root="'+id+'">'+I(icon)+t+'</button>').join('')}
function render(){nav();$('#content').innerHTML=view()+'<div class="note">Klickbare Referenz mit synthetischen Daten – kein echter Versand, Login oder Zahlungsvorgang.</div>';$('#navtitle').textContent=state.stack.length?name(state.page):'';$('#back').style.visibility=state.stack.length?'visible':'hidden';$('#back').innerHTML=I('left');$('#home').innerHTML=I('house');document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x.dataset.theme===(document.body.classList.contains('dark')?'dark':'light')))}
function go(p){if(!p)return;state.stack.push(state.page);state.page=p;state.query='';state.status='Alle';state.sort='az';render();scrollTo({top:0,behavior:'instant'})}
function home(p){state.stack=[];state.page=p;state.query='';state.status='Alle';render();scrollTo({top:0,behavior:'instant'})}
function back(){if(state.sheet){close();return}if(!state.stack.length)return;state.page=state.stack.pop();state.query='';state.status='Alle';render()}
function sheet(t){state.sheet=t;state.dirty=false;$('#modal').innerHTML='<div class="sheetback"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(t)+'"><div class="sheethead"><button class="circle" data-action="cancel" aria-label="Schliessen">'+I('x')+'</button><strong>'+esc(t)+'</strong><button class="circle" data-action="save" aria-label="Speichern">'+I('check')+'</button></div>'+G(F('Bezeichnung','Beispiel')+F('Notiz',''))+'<p class="note">Änderungen sind ausschliesslich lokal simuliert.</p></section></div>'}
function close(){if(state.dirty&&!confirm('Ungespeicherte Änderungen verwerfen?'))return;state.sheet=null;state.dirty=false;$('#modal').innerHTML=''}
function toast(t){let x=$('#toast');x.textContent=t;x.hidden=false;clearTimeout(window.msgTimer);window.msgTimer=setTimeout(()=>x.hidden=true,2000)}
document.addEventListener('click',e=>{let x=e.target.closest('button');if(!x)return;if(x.dataset.theme){document.body.classList.toggle('dark',x.dataset.theme==='dark');render();return}if(x.dataset.root){home(x.dataset.root);return}if(x.dataset.go){go(x.dataset.go);return}if(x.id==='back'){back();return}if(x.id==='home'){home('dashboard');return}if(x.dataset.record!==undefined){state.originalModule=state.page;state.record=Number(x.dataset.record);go('record');return}if(x.dataset.switch){let k=x.dataset.switch;state.switches[k]=!state.switches[k];render();return}if(x.dataset.error){state.error=x.dataset.error;render();return}let a=x.dataset.action;if(!a)return;if(a==='create'){if(state.page==='invoices'){state.step=1;go('wizard')}else sheet('Neu erfassen');return}if(a==='filter'||a==='edit'){sheet(a==='filter'?'Filter und Sortierung':'Bearbeiten');return}if(a==='timer'){state.ticking=!state.ticking;render();return}if(a==='stop'){state.ticking=false;render();return}if(a==='prev'){state.step=Math.max(1,state.step-1);render();return}if(a==='next'){if(state.step<4){state.step++;render()}else{home('invoices');toast('Rechnungsentwurf nur simuliert')}return}if(a==='send'){let v=$('#message');if(v?.value.trim()){state.chat.push(v.value.trim());render()}return}if(a==='cancel'){close();return}if(a==='save'){state.dirty=false;close();toast('Lokal simuliert');return}if(a==='simulate'){toast('Aktion nur simuliert');return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;let a=Array.from(document.querySelectorAll('.row[data-record]'));a.forEach(x=>{const i=Number(x.dataset.record),r=DATA[state.page]?.[i];x.style.display=(r&&r.join(' ').toLowerCase().includes(state.query.toLowerCase())&&(state.status==='Alle'||r[1]===state.status))?'':'none'});return}if(e.target.closest('.sheet'))state.dirty=true});
document.addEventListener('change',e=>{if(e.target.id==='status'){state.status=e.target.value;render()}if(e.target.id==='sort'){state.sort=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet)close()});
setInterval(()=>{if(!state.ticking)return;state.timer++;let x=$('#timer');if(x)x.textContent=[Math.floor(state.timer/3600),Math.floor(state.timer%3600/60),state.timer%60].map(n=>String(n).padStart(2,'0')).join(':')},1000);
render();
})();
</script></body></html>
