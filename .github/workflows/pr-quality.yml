name: PR quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    name: PR quality contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm ux:contract
      - run: node scripts/foundation-integration-test.mjs
      - run: node scripts/workflow-safety-test.mjs
      - name: Verify database schema and plan contracts
        run: |
          node scripts/schema-contract-test.mjs
          node scripts/plan-catalog-test.mjs
      - name: BINSO-CI-Profil prüfen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          profile = json.loads(Path("docs/ci-profile.json").read_text(encoding="utf-8"))
          assert profile["version"] == 1
          assert profile["profile"] in {"static", "backend", "critical", "tooling"}
          workflow = Path(profile["verificationWorkflow"])
          assert workflow.parent == Path(".github/workflows") and workflow.is_file()
          print("BINSO-CI-Profil:", profile["profile"])
          PY
