name: Operations Watch
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-watch
  cancel-in-progress: false
jobs:
  readiness-and-maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public liveness, database readiness and retention
        shell: bash
        run: |
          set -euo pipefail
          URL=https://one.binso.ch
          curl --fail --silent --show-error --retry 2 --max-time 20 "$URL/api/health" | jq -e '.status == "ok"' > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 20 "$URL/api/health/ready" | jq -e '.status == "ready"' > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 20 "$URL/api/health/retention" | jq -e '.status == "current"' > /dev/null
          echo 'Live readiness and scheduled retention freshness passed.' >> "$GITHUB_STEP_SUMMARY"
