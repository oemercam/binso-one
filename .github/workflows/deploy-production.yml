name: Azure production release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/invoke-private-migrations.mjs'
      - 'scripts/package-private-migrations.sh'
      - 'scripts/private-migration-*.mjs'
      - 'scripts/workflow-safety-test.mjs'
      - 'scripts/ux-browser-test.mjs'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      probe_migrations:
        description: Verify the private database migration path without deploying
        type: boolean
        default: false
      pilot:
        description: Activate customer pilot mode with the promoted package
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  package:
    if: github.repository_id == '1379293391' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Restore Next.js compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-production-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.*') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-production-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.*') }}-
      - run: pnpm build
      - run: bash scripts/package-production.sh
      - run: node scripts/release-artifact.mjs create deploy "$GITHUB_SHA"
      - run: bash scripts/package-private-migrations.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binso-release-${{ github.sha }}
          path: |
            deploy/binso-one.zip
            deploy/release-artifact.json
            deploy/private-migrations.tar.gz
            deploy/private-migration-probe.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  release:
    needs: package
    if: github.repository_id == '1379293391' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production-app
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CORE_OUTPUT: none
      APP: app-binso-one-prod
      GROUP: rg-binso-one-prod
      ACCOUNT: binsowebstagingpkg57c4
      CONTAINER: binso-one-prod-releases
      BASE: https://one.binso.ch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binso-release-${{ github.sha }}
          path: deploy
      - name: Verify package identity and compatibility with live database
        id: package
        if: inputs.probe_migrations != true
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          node scripts/release-artifact.mjs verify deploy "$GITHUB_SHA"
          live="$(curl -fsS --max-time 15 "$BASE/api/health" | jq -er '.sha | select(test("^[a-f0-9]{40}$"))')"
          git merge-base --is-ancestor "$live" "$GITHUB_SHA"
          if ! git diff --quiet "$live" "$GITHUB_SHA" -- database config infrastructure lib/server/env.ts .github/workflows/deploy-azure.yml ':(exclude)config/create-actions.ts' ':(exclude)config/plan-access.ts' ':(exclude)config/workspace-navigation.ts' ':(exclude)database/migrations' ':(exclude)database/schema-contract.json' ':(exclude)config/legal.ts'; then
            echo '::error::This release changes infrastructure or runtime settings outside the application migration path.'
            exit 1
          fi
          curl -fsS --max-time 15 "$BASE/api/health/ready" | jq -e '.status == "ready"'
          echo "live=$live" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$live" "$GITHUB_SHA" -- database/migrations database/schema-contract.json; then
            echo "migrate=false" >> "$GITHUB_OUTPUT"
          else
            echo "migrate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_DEPLOY_SUBSCRIPTION_ID }}
      - name: Verify the live rollback package through Azure
        id: rollback
        if: inputs.probe_migrations != true
        env:
          LIVE: ${{ steps.package.outputs.live }}
        run: |
          set -euo pipefail
          origin="https://$ACCOUNT.blob.core.windows.net/$CONTAINER/"
          previous="$(az webapp config appsettings list -g "$GROUP" -n "$APP" --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" -o tsv)"
          previous_blob="${previous#"$origin"}"
          [[ "$previous" == "$origin"* && "$previous_blob" =~ ^binso-one-$LIVE(-[a-f0-9]{64})?\.zip$ ]]
          test "$(az storage blob exists --account-name "$ACCOUNT" -c "$CONTAINER" -n "$previous_blob" --auth-mode login --query exists -o tsv)" = true
          prior_pilot="$(az webapp config appsettings list -g "$GROUP" -n "$APP" --query "[?name=='BINSO_PILOT'].value | [0]" -o tsv)"
          [[ -z "$prior_pilot" || "$prior_pilot" =~ ^[01]$ ]]
          echo "pilot=${prior_pilot:-0}" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Probe the private PostgreSQL migration slot
        if: inputs.probe_migrations == true
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          node scripts/invoke-private-migrations.mjs deploy/private-migration-probe.tar.gz
      - name: Apply migrations through the private Azure slot
        if: inputs.probe_migrations != true && steps.package.outputs.migrate == 'true'
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          node scripts/invoke-private-migrations.mjs deploy/private-migrations.tar.gz
      - name: Deploy package to production
        id: release
        if: inputs.probe_migrations != true
        env:
          LIVE: ${{ steps.package.outputs.live }}
          PREVIOUS: ${{ steps.rollback.outputs.previous }}
          PRIOR_PILOT: ${{ steps.rollback.outputs.pilot }}
          ENABLE_PILOT: ${{ github.event_name == 'workflow_dispatch' && inputs.pilot }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(curl -fsS --max-time 15 "$BASE/api/health" | jq -er '.sha')" = "$LIVE"
          origin="https://$ACCOUNT.blob.core.windows.net/$CONTAINER/"
          digest="$(sha256sum deploy/binso-one.zip | cut -d ' ' -f 1)"
          blob="binso-one-$GITHUB_SHA-$digest.zip"
          if [[ "$(az storage blob exists --account-name "$ACCOUNT" -c "$CONTAINER" -n "$blob" --auth-mode login --query exists -o tsv)" != true ]]; then
            az storage blob upload --account-name "$ACCOUNT" -c "$CONTAINER" -n "$blob" -f deploy/binso-one.zip --auth-mode login --overwrite false --validate-content --metadata "sha256=$digest"
          fi
          test "$(az storage blob show --account-name "$ACCOUNT" -c "$CONTAINER" -n "$blob" --auth-mode login --query metadata.sha256 -o tsv)" = "$digest"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          pilot="$PRIOR_PILOT"
          if [[ "$ENABLE_PILOT" == true ]]; then pilot=1; fi
          echo "pilot=$pilot" >> "$GITHUB_OUTPUT"
          az webapp config appsettings set -g "$GROUP" -n "$APP" --settings "WEBSITE_RUN_FROM_PACKAGE=$origin$blob" "BINSO_PILOT=$pilot"
      - name: Verify live deployment
        if: inputs.probe_migrations != true
        env:
          PILOT: ${{ steps.release.outputs.pilot }}
        run: |
          set -euo pipefail
          unzip -p deploy/binso-one.zip public/sw.js > "$RUNNER_TEMP/expected-sw.js"
          test -s "$RUNNER_TEMP/expected-sw.js"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            if curl -fsS --max-time 12 "$BASE/api/health" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .sha == $sha' &&
               curl -fsS --max-time 12 "$BASE/api/health/ready" | jq -e '.status == "ready"' &&
               curl -fsS --max-time 12 "$BASE/api/health/retention" | jq -e '.status == "current"' &&
               curl -fsS --max-time 12 "$BASE/login" -o /dev/null &&
               curl -fsS --max-time 12 -H 'Cache-Control: no-cache' "$BASE/sw.js" -o "$RUNNER_TEMP/live-sw.js" &&
               cmp -s "$RUNNER_TEMP/expected-sw.js" "$RUNNER_TEMP/live-sw.js" &&
               { [[ "$PILOT" == 0 ]] || { curl -fsS --max-time 12 "$BASE/preise" -o "$RUNNER_TEMP/live-prices.html" && grep -q 'data-binso-pilot="1"' "$RUNNER_TEMP/live-prices.html"; }; }; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Restore previous package on failure
        if: failure() && steps.release.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.release.outputs.previous }}
          PRIOR_PILOT: ${{ steps.rollback.outputs.pilot }}
        run: az webapp config appsettings set -g "$GROUP" -n "$APP" --settings "WEBSITE_RUN_FROM_PACKAGE=$PREVIOUS" "BINSO_PILOT=$PRIOR_PILOT"
